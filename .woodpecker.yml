steps:
  hello-world:
    image: alpine
    commands:
      - echo "=========================================="
      - echo "         Hello, World!                    "
      - echo "  Demonstração prática - Woodpecker CI    "
      - echo "=========================================="
      - echo "Repositório integrado com sucesso!"
      - echo ""
      - 'echo " >> Etapa 1: Preparando ambiente..."'
      - sleep 1
      - echo "Ambiente pronto."

  simulando-testes:
    image: alpine
    commands:
      - 'echo ">> Etapa 2: Executando testes automatizados (simulação)..."'
      - echo "[TEST] test_login .............. OK"
      - echo "[TEST] test_cadastro_usuario ... OK"
      - echo "[TEST] test_api_status ......... OK"
      - echo "[TEST] test_conexao_banco ...... OK"
      - echo "Todos os testes passaram com sucesso!"

  teste-falho:
    image: alpine
    commands:
      - echo ">> Etapa extra: Testando cenário de falha proposital"
      - echo "[TEST] test_pagamento_invalido ... FAIL"
      - echo "Erro: valor recebido não corresponde ao esperado"
      - exit 1
      
  finalizando:
    image: alpine
    commands:
      - 'echo ">> Etapa 3: Build/Deploy concluído (simulação)."'
      - echo "Pipeline executado em:"
      - date
      - echo "=========================================="
      - echo "  Pipeline finalizado com sucesso :)      "
      - echo "=========================================="
